<style>
/* Layout: one centred column. Title and status on top, the glass tank as the hero, a single control row beneath. */
:root{
  --bg:#071419;

  --ink:#e4f2f0;
  --muted:#86abab;
  --accent:#ffa94d;
  --accent-ink:#2a1500;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#root{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:52ch}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.stats b{color:var(--ink);font-weight:600;margin-left:6px}
.tank{
  position:relative;width:100%;aspect-ratio:16/10;max-height:72vh;border-radius:10px;overflow:hidden;
  background:#0a3a4a;border:1px solid #2c6676;
  box-shadow:0 0 0 7px #0b1a20,0 0 0 8px var(--line),0 28px 60px rgba(0,0,0,.5);
}
.tank canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.tank.tap canvas{cursor:pointer}
.tank::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;
  box-shadow:inset 0 0 0 1px rgba(200,255,250,.12),inset 18px 0 30px -18px rgba(190,255,250,.18)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
button:hover{border-color:#3a7486}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:flex;gap:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.hint{color:var(--muted);font-size:13px;margin:0}
@media (max-width:600px){.tank{aspect-ratio:4/3}}
</style>

<script>
(function(){

    /* ---------- fish ---------- */

    function pickTarget(f){var s=SPECIES[f.sp];

        var ox=o.x-f.x,oy=o.y-f.y,od=Math.hypot(ox,oy)||1,ol=SPECIES[o.sp].L*o.size*sc;
        if(od<(L+ol)*.7){var push=(1-od/((L+ol)*.7))*base*1.5;dvx-=ox/od*push;dvy-=oy/od*push}
        else if(s.school&&o.sp===f.sp&&od<170*sc&&!target&&m==='cruise'){dvx+=ox*.25+(o.vx-f.vx)*.35;dvy+=oy*.25+(o.vy-f.vy)*.35}}
      var mg=36*sc,floor=sandY(f.x)-L*.45-14*sc;
      if(f.x<mg)dvx+=base*1.2;if(f.x>W-mg)dvx-=base*1.2;
      if(f.y<S.surf+mg*.7)dvy+=base*1.2;if(f.y>floor)dvy-=base*1.8*(1+(f.y-floor)/(20*sc));
      var k=clamp(turn*dt,0,1);f.vx+=(dvx-f.vx)*k;f.vy+=(dvy-f.vy)*k;
      var sp2=Math.hypot(f.vx,f.vy),cap=base*4;if(sp2>cap){f.vx*=cap/sp2;f.vy*=cap/sp2}
      f.x+=f.vx*dt;f.y+=f.vy*dt;
      f.x=clamp(f.x,-30,W+30);f.y=clamp(f.y,S.surf+6,sandY(f.x)-6);
      if(Math.abs(f.vx)>6*sc)f.face=Math.sign(f.vx);
      f.flip+=(f.face-f.flip)*clamp(dt*7,0,1);
      f.phase+=dt*(3+Math.hypot(f.vx,f.vy)*.1/sc);
      if(f.eat>0)f.eat-=dt;
    }
    function drawFish(f){
      var s=SPECIES[f.sp],L=s.L*f.size*S.sc,bh=L*s.bh,sw=Math.sin(f.phase)*L*.17,c=ctx;
      var tilt=clamp(Math.atan2(f.vy,Math.abs(f.vx)+10),-.6,.6)*f.face;
      c.save();c.translate(f.x,f.y);c.rotate(tilt);c.scale(f.flip,1);
      var tl=L*s.tail;
      c.fillStyle=s.fin;c.globalAlpha=.92;c.beginPath();c.moveTo(-L*.36,0);
      c.quadraticCurveTo(-L*.36-tl*.5,-tl*.55+sw*.4,-L*.36-tl,-tl*.7+sw);
      c.quadraticCurveTo(-L*.36-tl*.62,sw*.5,-L*.36-tl,tl*.7+sw);
      c.quadraticCurveTo(-L*.36-tl*.5,tl*.55+sw*.4,-L*.36,0);c.closePath();c.fill();
      var dh=bh*s.dorsal*1.6+bh*.1;
      c.beginPath();c.moveTo(L*.2,-bh*.85);c.quadraticCurveTo(L*.05,-bh-dh,-L*.3-dh*.2,-bh-dh*(f.sp==='angel'?.9:.1)+sw*.2);c.quadraticCurveTo(-L*.2,-bh*.7,-L*.3,-bh*.4);c.closePath();c.fill();
      if(f.sp==='angel'){c.beginPath();c.moveTo(L*.15,bh*.85);c.quadraticCurveTo(L*.0,bh+dh,-L*.3-dh*.2,bh+dh*.9+sw*.2);c.quadraticCurveTo(-L*.2,bh*.7,-L*.3,bh*.4);c.closePath();c.fill()}
      else{c.beginPath();c.moveTo(L*.1,bh*.8);c.quadraticCurveTo(-L*.02,bh+bh*.5,-L*.14,bh*.75+sw*.1);c.closePath();c.fill()}
      c.globalAlpha=1;
      var p=new Path2D(),k=f.sp==='angel'?1.2:1;
      p.moveTo(L*.5,0);p.bezierCurveTo(L*.38,-bh*1.05*k,-L*.18,-bh*k,-L*.40,-bh*.18);p.lineTo(-L*.40,bh*.18);p.bezierCurveTo(-L*.18,bh*k,L*.38,bh*1.05*k,L*.5,0);p.closePath();
      c.fillStyle=s.body;c.fill(p);
      c.save();c.clip(p);
      if(f.sp==='clown'){[[.2,.1],[-.1,.11],[-.33,.07]].forEach(function(b){c.fillStyle='#14110f';c.fillRect(L*b[0]-L*b[1]/2-1.5,-bh*1.2,L*b[1]+3,bh*2.4);c.fillStyle='#fff';c.fillRect(L*b[0]-L*b[1]/2,-bh*1.2,L*b[1],bh*2.4)})}
      else if(f.sp==='tang'){c.fillStyle='#0f2478';c.beginPath();c.ellipse(-L*.02,-bh*.12,L*.3,bh*.38,-.35,0,6.28);c.fill();c.fillStyle='#ffd400';c.fillRect(-L*.42,-bh,L*.12,bh*2)}
      else if(f.sp==='tetra'){c.fillStyle='#2d6cff';c.fillRect(-L*.4,-bh*.42,L*.85,bh*.22);c.fillStyle='#ff3d5a';c.fillRect(-L*.4,bh*.15,L*.52,bh*.55)}
      else if(f.sp==='angel'){c.fillStyle='#17151a';c.fillRect(L*.08,-bh*1.4,L*.09,bh*2.8);c.fillRect(-L*.2,-bh*1.4,L*.08,bh*2.8)}
      else if(f.sp==='gold'){c.fillStyle='rgba(255,230,160,.35)';c.beginPath();c.ellipse(L*.05,bh*.45,L*.3,bh*.35,0,0,6.28);c.fill()}
      var g=c.createLinearGradient(0,-bh,0,bh);g.addColorStop(0,'rgba(255,255,255,.34)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.30)');

      var er=Math.max(2,L*.055);c.fillStyle='#fff';c.beginPath();c.arc(L*.34,-bh*.2,er,0,6.28);c.fill();
      c.fillStyle='#0a0f12';c.beginPath();c.arc(L*.355,-bh*.2,er*.55,0,6.28);c.fill();
      if(f.eat>0){c.fillStyle='rgba(20,10,10,.8)';c.beginPath();c.arc(L*.5,bh*.02,L*.035,0,6.28);c.fill()}
      c.restore();
    }

    /* ---------- food, bubbles ---------- */
    function feed(x,n){
      var u=H/500;
      for(var i=0;i<n&&S.food.length<140;i++){
        S.food.push({x:x+rnd(-14,14)*S.sc,y:S.surf+rnd(0,6),vx:rnd(-10,10),vy:rnd(14,26)*u,ph:rnd(0,6.28),life:16,landed:false,r:rnd(1.8,3.2)*S.sc,col:['#e0a04a','#c9602f','#8fae4a'][Math.floor(Math.random()*3)]});
      }
      S.ripples.push({x:x,r:2,life:1});
    }
    function updateFood(dt){
      for(var i=S.food.length-1;i>=0;i--){var fd=S.food[i];
        if(!fd.landed){fd.y+=fd.vy*dt;fd.x+=(Math.sin(S.t*1.5+fd.ph)*9*S.sc+fd.vx)*dt;fd.vx*=.985;
          var sy=sandY(fd.x)-2;if(fd.y>=sy){fd.y=sy+rnd(0,4);fd.landed=true;fd.life=14}}
        else{fd.life-=dt;if(fd.life<=0)S.food.splice(i,1)}}
    }
    function tap(x,y){
      S.rings.push({x:x,y:y,r:6,life:1});
      S.fish.forEach(function(f){if(Math.hypot(f.x-x,f.y-y)<320*S.sc)scare(f,x,y)});
    }

    /* ---------- frame ---------- */
    function frame(ts){
      var dt=Math.min(.05,(ts-(frame.last||ts))/1000);frame.last=ts;S.t+=dt;
      S.dimV+=((S.dim?1:0)-S.dimV)*Math.min(1,dt*3);
      S.schoolT-=dt;if(S.schoolT<=0){S.schoolT=rnd(3,7);S.schoolX=rnd(.12,.88)*W;S.schoolY=rnd(.22,.7)*H}
      S.fish.forEach(function(f){updateFish(f,dt)});updateFood(dt);
      S.nextBubble-=dt;if(S.nextBubble<=0){S.nextBubble=rnd(.12,.5);S.bubbles.push({x:S.airX+rnd(-3,3),y:S.airY,r:rnd(1.8,4.5),ph:rnd(0,6.28),v:rnd(45,85)*H/500})}
      for(var i=S.bubbles.length-1;i>=0;i--){var b=S.bubbles[i];b.y-=b.v*dt;b.x+=Math.sin(S.t*4+b.ph)*10*dt;b.r+=dt*.4;
        if(b.y<S.surf){S.bubbles.splice(i,1);if(b.r>2.5)S.ripples.push({x:b.x,r:2,life:.6})}}
      S.ripples.forEach(function(r){r.r+=dt*50;r.life-=dt*.9});S.ripples=S.ripples.filter(function(r){return r.life>0});
      S.rings.forEach(function(r){r.r+=dt*340;r.life-=dt*1.6});S.rings=S.rings.filter(function(r){return r.life>0});
      S.parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt+Math.sin(S.t+p.ph)*4*dt;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<S.surf)p.y=H*.85;if(p.y>H*.9)p.y=S.surf})
      draw();requestAnimationFrame(frame);
    }
    function drawPlants(front){
      var c=ctx;c.lineCap='round';
      plants.forEach(function(p){if(p.front!==front)return;
        var bx=p.x*W,by=sandY(bx)+6;
        p.blades.forEach(function(bl){
          var hh=H*p.h*bl.hh,sw=Math.sin(S.t*bl.sp+bl.ph)*hh*.16+Math.sin(S.t*.4+bl.ph*2)*hh*.06;
          c.strokeStyle=p.c;c.lineWidth=bl.w*S.sc;c.beginPath();c.moveTo(bx+bl.o*S.sc,by);
          c.quadraticCurveTo(bx+bl.o*S.sc+sw*.3,by-hh*.55,bx+bl.o*S.sc*1.2+sw,by-hh);c.stroke();
          c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=1.2;c.beginPath();c.moveTo(bx+bl.o*S.sc,by);
          c.quadraticCurveTo(bx+bl.o*S.sc+sw*.3,by-hh*.55,bx+bl.o*S.sc*1.2+sw,by-hh);c.stroke()});
      });
    }
    function draw(){
      var c=ctx;
      var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3aa4ae');g.addColorStop(.35,'#14688a');g.addColorStop(.75,'#0b3d57');g.addColorStop(1,'#082b3f');
      c.fillStyle=g;c.fillRect(0,0,W,H);
      c.drawImage(S.back,0,0,W,H);
      var ra=.1*(1-S.dimV);
      if(ra>.005){for(var i=0;i<6;i++){
        var x0=(i+.5)/6*W+Math.sin(S.t*.25+i*1.7)*W*.05,w0=W*.025,w1=W*.09,sh=Math.sin(S.t*.2+i)*W*.06;
        var rg=c.createLinearGradient(0,0,0,H*.9);rg.addColorStop(0,'rgba(200,255,245,'+ra*(.7+.3*Math.sin(S.t*.6+i*2))+')');rg.addColorStop(1,'rgba(200,255,245,0)');
        c.fillStyle=rg;c.beginPath();c.moveTo(x0-w0,0);c.lineTo(x0+w0,0);c.lineTo(x0+sh+w1,H*.9);c.lineTo(x0+sh-w1,H*.9);c.closePath();c.fill()}}
      c.fillStyle='rgba(220,255,250,.35)';
      S.parts.forEach(function(p){c.fillRect(p.x,p.y,p.r,p.r)});
      drawPlants(false);
      S.fish.slice().sort(function(a,b){return a.size-b.size}).forEach(drawFish);
      drawPlants(true);
      c.drawImage(S.front,0,0,W,H);
      S.food.forEach(function(fd){var a=fd.landed?clamp(fd.life/3,0,1):1;c.globalAlpha=a;c.fillStyle=fd.col;c.beginPath();c.ellipse(fd.x,fd.y,fd.r,fd.r*.7,fd.ph,0,6.28);c.fill()});c.globalAlpha=1;
      S.bubbles.forEach(function(b){c.fillStyle='rgba(255,255,255,.12)';c.strokeStyle='rgba(235,255,255,.6)';c.lineWidth=1;c.beginPath();c.arc(b.x,b.y,b.r,0,6.28);c.fill();c.stroke();
        c.fillStyle='rgba(255,255,255,.7)';c.beginPath();c.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.25,0,6.28);c.fill()});
      var sy=S.surf;
      c.fillStyle='rgba(6,22,30,.55)';c.fillRect(0,0,W,sy-2);
      c.strokeStyle='rgba(200,250,245,.55)';c.lineWidth=2;c.beginPath();
      for(var x=0;x<=W;x+=8){var yy=sy+Math.sin(x*.03+S.t*2)*1.3+Math.sin(x*.011-S.t*1.1)*1.2;if(x===0)c.moveTo(x,yy);else c.lineTo(x,yy)}c.stroke();
      var sg=c.createLinearGradient(0,sy,0,sy+16);sg.addColorStop(0,'rgba(200,255,250,.28)');sg.addColorStop(1,'rgba(200,255,250,0)');c.fillStyle=sg;c.fillRect(0,sy,W,16);
      c.strokeStyle='rgba(220,255,250,.7)';
      S.ripples.forEach(function(r){c.globalAlpha=clamp(r.life,0,1);c.lineWidth=1.3;c.beginPath();c.ellipse(r.x,sy+2,r.r,r.r*.18,0,0,6.28);c.stroke()});
      S.rings.forEach(function(r){c.globalAlpha=clamp(r.life,0,1)*.7;c.lineWidth=2;c.strokeStyle='rgba(235,255,255,1)';c.beginPath();c.arc(r.x,r.y,r.r,0,6.28);c.stroke()});
      c.globalAlpha=1;
      if(S.dimV>.01){c.fillStyle='rgba(2,10,26,'+(.62*S.dimV)+')';c.fillRect(0,0,W,H)}

    /* ---------- sizing + input ---------- */
    function resize(){
      var nw=Math.max(240,wrap.clientWidth),nh=Math.max(180,wrap.clientHeight);
      if(nw===W&&nh===H&&S.back)return;

    function pos(e){var r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}}

    }
    function onMove(e){
      var p=pos(e);S.cur={x:p.x,y:p.y,t:S.t};

    function onUp(){S.down=false}
    canvas.addEventListener('pointerdown',onDown);canvas.addEventListener('pointermove',onMove);
    canvas.addEventListener('pointerup',onUp);canvas.addEventListener('pointercancel',onUp);

    resize();
    var ro=new ResizeObserver(resize);ro.observe(wrap);
    for(var i=0;i<60;i++)S.parts.push({x:rnd(0,W),y:rnd(S.surf,H*.85),vx:rnd(-4,4),vy:rnd(1,5),ph:rnd(0,6),r:rnd(1,2)});
    START.forEach(function(sp){S.fish.push(makeFish(sp,false))});
    S.schoolX=W*.4;S.schoolY=H*.4;
    props.apiRef.current={
      sprinkle:function(){feed(rnd(.15,.85)*W,10)},
      setMode:function(m){S.mode=m},
      setDim:function(d){S.dim=d},
      addFish:function(){if(S.fish.length<18)S.fish.push(makeFish(ADDABLE[Math.floor(Math.random()*ADDABLE.length)],true))}
    };
    var statTimer=setInterval(function(){
      props.onStats({fish:S.fish.length,food:S.food.filter(function(f){return !f.landed}).length,hungry:S.fish.filter(function(f){return f.hunger>.5}).length});
    },500);
    var raf=requestAnimationFrame(frame);
    return function(){cancelAnimationFrame(raf);clearInterval(statTimer);ro.disconnect();
      canvas.removeEventListener('pointerdown',onDown);canvas.removeEventListener('pointermove',onMove);
      canvas.removeEventListener('pointerup',onUp);canvas.removeEventListener('pointercancel',onUp)};
  },[]);
  return h('div',{className:'tank'+(props.mode==='tap'?' tap':'')},h('canvas',{ref:ref,'aria-label':'Aquarium with fish, a castle, shells and a sandy floor'}));
}

function App(){
  var _m=useState('food'),mode=_m[0],setMode=_m[1];
  var _l=useState(true),lights=_l[0],setLights=_l[1];
  var _s=useState({fish:14,food:0,hungry:0}),stats=_s[0],setStats=_s[1];
  var api=useRef({});
  useEffect(function(){api.current.setMode&&api.current.setMode(mode)},[mode]);
  useEffect(function(){api.current.setDim&&api.current.setDim(!lights)},[lights]);
  return h(React.Fragment,null,
    h('header',null,
      h('div',null,h('h1',null,'Pocket Aquarium'),
        h('p',{className:'sub'},'Click or drag inside the tank to drop food. Switch to Tap glass to startle the fish and watch where they hide.')),
      h('div',{className:'stats','aria-live':'off'},
        h('span',null,'Fish',h('b',null,stats.fish)),h('span',null,'Floating food',h('b',null,stats.food)),h('span',null,'Hungry',h('b',null,stats.hungry)))),
    h(Tank,{apiRef:api,onStats:setStats,mode:mode}),
    h('div',{className:'controls'},
      h('button',{className:'primary',onClick:function(){api.current.sprinkle()}},'Sprinkle food'),
      h('div',{className:'seg',role:'group','aria-label':'Click action'},
        h('button',{'aria-pressed':mode==='food',onClick:function(){setMode('food')}},'Drop food'),
        h('button',{'aria-pressed':mode==='tap',onClick:function(){setMode('tap')}},'Tap glass')),
      h('button',{'aria-pressed':!lights,onClick:function(){setLights(!lights)}},lights?'Lights off':'Lights on'),

})();
</script>
